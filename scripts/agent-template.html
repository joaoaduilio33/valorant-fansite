<!doctype html>
<!-- Gerado por scripts/generate-pages.mjs a partir de scripts/agent-template.html. Não edite à mão. -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{name}} // Protocolo VALORANT</title>
  <meta name="description" content="{{description}}">
  <meta property="og:title" content="{{name}} // Protocolo VALORANT"><meta property="og:description" content="{{description}}"><meta property="og:type" content="profile"><meta property="og:image" content="{{image}}">
  <meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="{{name}} // Protocolo VALORANT"><meta name="twitter:description" content="{{description}}"><meta name="twitter:image" content="{{image}}">
  <meta name="theme-color" content="{{color}}">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112..125,700..900&family=Jost:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../../src/home.css"><link rel="stylesheet" href="../../src/video.css"><link rel="stylesheet" href="../../src/agent-page.css">
</head>
<body class="agent-page" data-agent="{{slug}}" data-uuid="{{uuid}}" data-card="{{card}}" style="--agent:{{color}}">
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <div id="agent-app"><noscript>Ative o JavaScript para ver o arquivo de {{name}}.</noscript></div>
  <script type="module" src="../../src/agent-page.js"></script>
</body>
</html>
